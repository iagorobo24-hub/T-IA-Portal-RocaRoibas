<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura de TIA-Claude</title>
  <desc id="d">Un agente de IA lee el contrato AGENTS.md y la base de conocimiento, habla con los servidores MCP tia-inspect o tia-create, que usan la API Openness para operar TIA Portal V20 sobre un proyecto desechable con manifiesto.</desc>
  <rect width="1280" height="560" rx="24" fill="#0d1020"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="48" font-size="26" font-weight="700" fill="#ffffff">Cómo se conecta un agente con TIA Portal</text>

    <rect x="40" y="110" width="250" height="150" rx="16" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/>
    <text x="165" y="155" font-size="22" font-weight="700" fill="#ffffff">Agente de IA</text>
    <text x="165" y="188" font-size="15" fill="#b8c2d9">Claude Code, Codex,</text>
    <text x="165" y="210" font-size="15" fill="#b8c2d9">OpenCode, Cursor...</text>
    <text x="165" y="238" font-size="14" fill="#7f8aa8">(configuración por script)</text>

    <rect x="40" y="300" width="250" height="200" rx="16" fill="#101a30" stroke="#f5a623" stroke-width="2"/>
    <text x="165" y="338" font-size="19" font-weight="700" fill="#f5a623">Lo que lee antes</text>
    <text x="165" y="372" font-size="15" fill="#ffffff">AGENTS.md (contrato)</text>
    <text x="165" y="398" font-size="15" fill="#ffffff">10-kb/ conocimiento y recetas</text>
    <text x="165" y="424" font-size="15" fill="#ffffff">20-standards/ estándares</text>
    <text x="165" y="450" font-size="15" fill="#ffffff">60-library/ bloques SCL</text>
    <text x="165" y="476" font-size="15" fill="#ffffff">30-tools/ scripts y pruebas</text>

    <rect x="390" y="90" width="300" height="130" rx="16" fill="#2a2111" stroke="#f5a623" stroke-width="2"/>
    <text x="540" y="128" font-size="21" font-weight="700" fill="#f5a623">tia-inspect</text>
    <text x="540" y="156" font-size="15" fill="#ffffff">Leer, buscar, exportar a texto</text>
    <text x="540" y="180" font-size="15" fill="#b8c2d9">Solo lectura por defecto</text>
    <text x="540" y="202" font-size="14" fill="#7f8aa8">base: heilingbrunner/tiaportal-mcp</text>

    <rect x="390" y="250" width="300" height="130" rx="16" fill="#2a2111" stroke="#f5a623" stroke-width="2"/>
    <text x="540" y="288" font-size="21" font-weight="700" fill="#f5a623">tia-create (perfil lite)</text>
    <text x="540" y="316" font-size="15" fill="#ffffff">Crear proyectos, red, HMI</text>
    <text x="540" y="340" font-size="15" fill="#b8c2d9">Escritura, con vista previa</text>
    <text x="540" y="362" font-size="14" fill="#7f8aa8">base: bulaofen0036-coder</text>

    <rect x="390" y="410" width="300" height="90" rx="16" fill="#101a30" stroke="#19c3a6" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="540" y="445" font-size="16" fill="#19c3a6" font-weight="600">Invoke-McpToolSequence.ps1</text>
    <text x="540" y="470" font-size="14" fill="#b8c2d9">una sola sesión MCP a la vez</text>

    <rect x="800" y="110" width="200" height="150" rx="16" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/>
    <text x="900" y="160" font-size="21" font-weight="700" fill="#ffffff">API Openness</text>
    <text x="900" y="192" font-size="15" fill="#b8c2d9">.NET; exige grupo</text>
    <text x="900" y="214" font-size="15" fill="#b8c2d9">de Windows propio</text>

    <rect x="1060" y="110" width="190" height="150" rx="16" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/>
    <text x="1155" y="160" font-size="21" font-weight="700" fill="#ffffff">TIA Portal</text>
    <text x="1155" y="192" font-size="15" fill="#b8c2d9">V20 operativa</text>
    <text x="1155" y="214" font-size="14" fill="#7f8aa8">V21: sin verificar</text>

    <rect x="800" y="300" width="450" height="200" rx="16" fill="#101a30" stroke="#f5a623" stroke-width="2"/>
    <text x="1025" y="338" font-size="19" font-weight="700" fill="#f5a623">Dónde se puede escribir</text>
    <text x="1025" y="372" font-size="15" fill="#ffffff">Solo un proyecto desechable (fixture)</text>
    <text x="1025" y="398" font-size="15" fill="#ffffff">con manifiesto .tia-agent-fixture.json</text>
    <text x="1025" y="424" font-size="15" fill="#ffffff">y copia de seguridad idéntica</text>
    <text x="1025" y="458" font-size="15" fill="#b8c2d9">Nunca proyectos de cliente.</text>
    <text x="1025" y="482" font-size="15" fill="#b8c2d9">PLC físico: solo con permiso explícito.</text>

    <g stroke="#b8c2d9" stroke-width="3" fill="none">
      <path d="M290 160H390"/><path d="M290 190H340V315H390"/>
      <path d="M690 155H800"/><path d="M1000 185H1060"/>
      <path d="M690 315H745V230H800"/>
      <path d="M1155 260V300"/>
    </g>
    <g fill="#b8c2d9">
      <path d="M390 160l-10-6v12z"/><path d="M390 315l-10-6v12z"/>
      <path d="M800 155l-10-6v12z"/><path d="M1060 185l-10-6v12z"/>
      <path d="M800 230l-10-6v12z"/><path d="M1155 300l-6-10h12z"/>
    </g>
    <path d="M165 260V300" stroke="#f5a623" stroke-width="3" stroke-dasharray="5 4"/>
  </g>
</svg>
