<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Ciclo de trabajo con compuertas</title>
  <desc id="d">Ocho pasos para cambiar un proyecto: leer, proponer, copia de seguridad, vista previa, escribir, compilar sin errores, guardar y exportar a texto para git. Si no compila, se revierte.</desc>
  <rect width="1280" height="400" rx="24" fill="#0d1020"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="56" font-size="26" font-weight="700" fill="#ffffff">Ciclo de cambio: nada se guarda sin compilar</text>
    <g font-size="17" font-weight="600" fill="#ffffff">
      <rect x="30" y="100" width="130" height="90" rx="14" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/><text x="95" y="150">1. Leer</text>
      <rect x="170" y="100" width="130" height="90" rx="14" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/><text x="235" y="150">2. Proponer</text>
      <rect x="310" y="100" width="130" height="90" rx="14" fill="#2a2111" stroke="#f5a623" stroke-width="2"/><text x="375" y="150">3. Backup</text>
      <rect x="450" y="100" width="130" height="90" rx="14" fill="#2a2111" stroke="#f5a623" stroke-width="2"/><text x="515" y="150">4. Preview</text>
      <rect x="590" y="100" width="130" height="90" rx="14" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/><text x="655" y="150">5. Escribir</text>
      <rect x="730" y="100" width="150" height="90" rx="14" fill="#2a2111" stroke="#f5a623" stroke-width="3"/><text x="805" y="143">6. Compilar</text><text x="805" y="167" font-size="15" font-weight="400" fill="#f5a623">0 errores</text>
      <rect x="890" y="100" width="130" height="90" rx="14" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/><text x="955" y="150">7. Guardar</text>
      <rect x="1030" y="100" width="220" height="90" rx="14" fill="#1d2a47" stroke="#19c3a6" stroke-width="2"/><text x="1140" y="143">8. Exportar a texto</text><text x="1140" y="167" font-size="15" font-weight="400" fill="#b8c2d9">y commit en git</text>
    </g>
    <g stroke="#b8c2d9" stroke-width="2.5" fill="none">
      <path d="M160 145H170M300 145H310M440 145H450M580 145H590M720 145H730M880 145H890M1020 145H1030"/>
    </g>
    <path d="M805 190V250H655V202" stroke="#fe6b6b" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
    <path d="M655 192l-6 10h12z" fill="#fe6b6b"/>
    <text x="730" y="278" font-size="16" fill="#fe6b6b">si no compila: se arregla o se revierte</text>

    <rect x="30" y="320" width="1220" height="52" rx="12" fill="#101a30" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="640" y="353" font-size="17" fill="#f5a623">Sin metadata F/Safety completa no se importa ni se descarga · sin permiso explícito no se toca un PLC físico</text>
  </g>
</svg>
